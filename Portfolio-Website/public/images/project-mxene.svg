<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b2a" />
      <stop offset="100%" stop-color="#0a0512" />
    </linearGradient>
    <linearGradient id="mxeneLayer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad3)" stroke="#381e59" stroke-width="2" />

  <!-- 2D MXene Accordion Slabs (Ti3C2Tx Layers) -->
  <g transform="translate(100, 110)">
    <!-- Top MXene Sheet -->
    <path d="M 50 40 L 380 40 L 450 90 L 120 90 Z" fill="url(#mxeneLayer)" stroke="#d8b4fe" stroke-width="1.5" />
    <!-- Atoms on top sheet -->
    <circle cx="160" cy="65" r="9" fill="#06b6d4" />
    <circle cx="230" cy="65" r="9" fill="#06b6d4" />
    <circle cx="300" cy="65" r="9" fill="#06b6d4" />
    <circle cx="370" cy="65" r="9" fill="#06b6d4" />
    <!-- Terminations (-O, -F) -->
    <circle cx="195" cy="50" r="7" fill="#ef4444" />
    <circle cx="265" cy="50" r="7" fill="#10b981" />
    <circle cx="335" cy="50" r="7" fill="#ef4444" />

    <!-- 28 Angstrom Vacuum Indicator -->
    <line x1="480" y1="90" x2="480" y2="160" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,3" />
    <text x="495" y="130" fill="#c084fc" font-size="12" font-family="monospace">28 Å Vacuum</text>

    <!-- Bottom MXene Sheet -->
    <path d="M 50 160 L 380 160 L 450 210 L 120 210 Z" fill="url(#mxeneLayer)" stroke="#d8b4fe" stroke-width="1.5" />
    <!-- Atoms on bottom sheet -->
    <circle cx="160" cy="185" r="9" fill="#06b6d4" />
    <circle cx="230" cy="185" r="9" fill="#06b6d4" />
    <circle cx="300" cy="185" r="9" fill="#06b6d4" />
    <circle cx="370" cy="185" r="9" fill="#06b6d4" />

    <!-- Migrating Na+ Ion on CI-NEB Path -->
    <circle cx="265" cy="120" r="14" fill="#f59e0b" filter="url(#glow3)" />
    <text x="265" y="125" fill="#ffffff" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Na⁺</text>
  </g>

  <!-- CI-NEB Energy Barrier Chart (Right Side) -->
  <g transform="translate(530, 90)">
    <rect width="220" height="230" rx="8" fill="#120820" stroke="#3b1d60" stroke-width="1.5" />
    <text x="15" y="30" fill="#d8b4fe" font-size="12" font-family="sans-serif" font-weight="600">CI-NEB DIFFUSION BARRIER</text>
    <text x="15" y="48" fill="#9381a8" font-size="11" font-family="monospace">Quantum ESPRESSO 7.5</text>

    <!-- Axes -->
    <line x1="25" y1="70" x2="25" y2="190" stroke="#4c267a" stroke-width="1.5" />
    <line x1="25" y1="190" x2="200" y2="190" stroke="#4c267a" stroke-width="1.5" />

    <!-- Energy Curve (NEB Barrier) -->
    <path d="M 30 180 Q 70 180 110 95 Q 150 180 190 180" fill="none" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Images along NEB path -->
    <circle cx="30" cy="180" r="4" fill="#a855f7" />
    <circle cx="70" cy="150" r="4" fill="#a855f7" />
    <circle cx="110" cy="95" r="6" fill="#f59e0b" filter="url(#glow3)" />
    <circle cx="150" cy="150" r="4" fill="#a855f7" />
    <circle cx="190" cy="180" r="4" fill="#a855f7" />

    <text x="110" y="80" fill="#f59e0b" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">E_barrier</text>
    <text x="110" y="212" fill="#9381a8" font-size="10" font-family="sans-serif" text-anchor="middle">Reaction Coordinate</text>
  </g>

  <!-- Badge / Tags -->
  <rect x="50" y="45" width="240" height="32" rx="6" fill="#2d1547" stroke="#9333ea" stroke-width="1.5" />
  <text x="65" y="66" fill="#c084fc" font-size="13" font-family="sans-serif" font-weight="600" letter-spacing="1">COMPUTATIONAL MATERIALS</text>

  <!-- Title & Subtitle -->
  <text x="50" y="420" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="bold">Defect-Engineered Ti₃C₂Tₓ MXene Na-Ion Anodes</text>
  <text x="50" y="450" fill="#d8b4fe" font-size="15" font-family="sans-serif">Quantum ESPRESSO • DFT • CI-NEB Diffusion • Bayesian &amp; GNN Optimization</text>
</svg>