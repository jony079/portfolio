<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#080c12" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad4)" stroke="#1e2d3d" stroke-width="2" />

  <!-- Fe-C Phase Diagram Vector Illustration -->
  <g transform="translate(100, 100)">
    <!-- Diagram Frame -->
    <rect width="600" height="260" rx="8" fill="#0c1219" stroke="#22384f" stroke-width="1.5" />

    <!-- Axes -->
    <line x1="60" y1="30" x2="60" y2="220" stroke="#475569" stroke-width="2" />
    <line x1="60" y1="220" x2="550" y2="220" stroke="#475569" stroke-width="2" />

    <!-- Axis labels -->
    <text x="30" y="125" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600" transform="rotate(-90 30 125)">Temp (°C)</text>
    <text x="300" y="245" fill="#94a3b8" font-size="12" font-family="sans-serif" font-weight="600" text-anchor="middle">Weight Percent Carbon (wt% C)</text>

    <!-- Liquidus Line (L) -->
    <path d="M 60 40 Q 180 50 320 100 L 520 150" fill="none" stroke="#f43f5e" stroke-width="2.5" />
    <text x="240" y="65" fill="#f43f5e" font-size="13" font-family="sans-serif" font-weight="bold">Liquid (L)</text>

    <!-- Austenite (γ) Phase Field -->
    <polygon points="60,90 180,90 220,150 90,150" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="2" />
    <text x="135" y="125" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="bold" text-anchor="middle">γ (Austenite)</text>

    <!-- Eutectic Isotherm (1147 °C) -->
    <line x1="180" y1="100" x2="520" y2="100" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" />
    <text x="440" y="93" fill="#f59e0b" font-size="11" font-family="monospace">1147 °C (Eutectic)</text>

    <!-- Eutectoid Isotherm (727 °C) -->
    <line x1="75" y1="170" x2="520" y2="170" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
    <text x="440" y="165" fill="#10b981" font-size="11" font-family="monospace">727 °C (Eutectoid)</text>

    <!-- Ferrite (α) + Pearlite region -->
    <text x="110" y="200" fill="#a7f3d0" font-size="11" font-family="sans-serif">α + Fe₃C (Pearlite)</text>

    <!-- Tie-Line & Lever Rule Indicator -->
    <line x1="90" y1="140" x2="280" y2="140" stroke="#ec4899" stroke-width="2" />
    <circle cx="160" cy="140" r="5" fill="#ec4899" filter="url(#glow4)" />
    <text x="160" y="130" fill="#f472b6" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Lever Rule Fulcrum</text>
  </g>

  <!-- Badge / Tags -->
  <rect x="50" y="45" width="220" height="32" rx="6" fill="#132738" stroke="#0ea5e9" stroke-width="1.5" />
  <text x="65" y="66" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="600" letter-spacing="1">THERMODYNAMICS & ALLOYS</text>

  <!-- Title & Subtitle -->
  <text x="50" y="420" fill="#ffffff" font-size="24" font-family="sans-serif" font-weight="bold">Fe-C &amp; Multi-Alloy Phase Diagram Simulator</text>
  <text x="50" y="450" fill="#94a3b8" font-size="15" font-family="sans-serif">Python • Streamlit | Lever Rule, Andrews Ms Martensite Kinetics &amp; CCT Overlays</text>
</svg>